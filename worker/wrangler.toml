name = "personal-workbench"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# 前端静态资源（由 web/ 构建产出：cd web && npm run build）
# run_worker_first: /api/* 一律先走 Worker 代码，其余路径优先匹配静态资源；
# not_found_handling: 未命中静态资源的路由回退到 index.html（SPA 前端路由）。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# R2 对象存储：文档库文件 + 头像（部署前需在 CF 控制台创建同名 bucket）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "workbench-files"
